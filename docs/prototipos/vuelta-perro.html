<title>Vuelta del perro</title>

<style>
:root { --bg:#FBF6EE; --card:#FFFDF9; --line:#E8DCCD; --ink:#3A2E27; --muted:#6E5E52; --cocoa:#8A5536; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Nunito, sans-serif; }
main { max-width:760px; margin:0 auto; padding:20px 16px 32px; }
h1 { font-size:22px; font-weight:800; margin:0 0 4px; }
p { color:var(--muted); font-weight:600; margin:0 0 16px; font-size:14px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stage { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:12px; text-align:center; }
.stage h2 { font-size:15px; font-weight:800; margin:4px 0 0; }
.stage small { color:var(--muted); font-weight:600; }
.pet { height:260px; display:flex; align-items:flex-end; justify-content:center; }
.pet > div { transform-origin:50% 95%; }
.pet svg { width:min(200px, 38vw); height:auto; display:block; }
.strip { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:12px; }
.cell svg { display:block; }
button { margin-top:14px; font:800 14px Nunito, sans-serif; color:var(--cocoa); background:#FBE7E3; border:0; border-radius:999px; padding:10px 18px; }
</style></head><body><main>
<h1>Vuelta del perro: antes y ahora</h1>

let speed = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms * speed));
function put(el, step) { el.innerHTML = step[0]; el.dataset.m = step[1] ? -1 : 1; }
function pose(el, sx, rot, y, ms) {
  const m = Number(el.dataset.m || 1);
  return el.animate([{}, { transform: `translateY(${y}px) rotate(${rot}deg) scaleX(${m * sx})` }],
    { duration: ms * speed, fill: 'forwards', easing: 'ease-in-out' }).finished;
}
async function runOld(el) {
  put(el, OLD[0]);
  let side = 1;
  for (const st of OLD.slice(1)) {
    await pose(el, 0.15, 0, 0, 60);   // se afina
    put(el, st);
    await pose(el, 1, 5 * side, -4, 300);
    await pose(el, 1, 0, 0, 240);
    side = -side;
  }
}
async function runNew(el) {
  put(el, NEW[0]);
  let side = 1;
  for (const st of NEW.slice(1)) {
    await pose(el, 0.96, 3 * side, -3, 70);
    put(el, st);
    await pose(el, 1, 0, 0, 200);
    side = -side;
  }
}
async function loop() {
  const o = document.getElementById('old'), n = document.getElementById('new');
  while (true) {
    put(o, OLD[0]); put(n, NEW[0]);
    await sleep(900);
    await Promise.all([runOld(o), runNew(n)]);
    await sleep(1400);
  }
}
document.getElementById('slow').onclick = e => { speed = speed === 1 ? 2.5 : 1; e.target.textContent = speed === 1 ? 'Ver más lento' : 'Velocidad normal'; };
loop();
